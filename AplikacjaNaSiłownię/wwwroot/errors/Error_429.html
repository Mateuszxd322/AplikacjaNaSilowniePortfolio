<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zbyt wiele żądań | Aplikacja na Siłownię</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #f43f5e;
            --primary-glow: rgba(244, 63, 94, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .background-glow {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(80px);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 680px;
            text-align: center;
            padding: 60px 80px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.25);
            border-radius: 50%;
            margin-bottom: 28px;
            color: var(--primary);
            font-size: 38px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 20px 0;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text; /* Dodane dla pełnej kompatybilności i zgodności ze standardem W3C */
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 18px;
            color: var(--text-muted);
            line-height: 1.65;
            margin: 0 0 40px 0;
        }

        .timer-badge {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            background: rgba(244, 63, 94, 0.08);
            border: 1px solid rgba(244, 63, 94, 0.2);
            padding: 10px 24px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary) 0%, #e11d48 100%);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 17px;
            box-shadow: 0 5px 20px rgba(244, 63, 94, 0.4);
            transition: all 0.2s ease;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="container">
        <div class="icon-box">🛡️</div>
        <h1>Wykryto zbyt wiele żądań</h1>
        <p>Ze względów bezpieczeństwa (ochrona przed odgadywaniem hasła i spamem) możliwość wykonywania kolejnych operacji z Twojego adresu IP została tymczasowo ograniczona.</p>
        <div class="timer-badge">Spróbuj ponownie za 10 sekund</div>
        <button class="btn" onclick="window.location.reload()">Odśwież stronę</button>
    </div>
</body>
</html>
